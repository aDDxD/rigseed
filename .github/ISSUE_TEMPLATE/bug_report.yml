name: Bug report / Relatar problema
description: Report reproducible behavior using synthetic configuration.
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, real config dumps, state or backups. For vulnerabilities, read SECURITY.md.
        Não inclua tokens, configurações reais, state ou backups. Para vulnerabilidades, leia SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Versions / Versões
      description: rigseed, Node.js, Codex and OS versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / Reprodução mínima
      description: Commands and synthetic input files, preferably in a temporary HOME.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / Comportamento esperado e observado
    validations:
      required: true
